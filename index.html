<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autorización de TikTok</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0e14; color: #e8ecf1;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
  }
  .caja {
    max-width: 640px; width: 100%;
    background: #131824; border: 1px solid #26304a; border-radius: 14px;
    padding: 32px;
  }
  h1 { font-size: 21px; margin: 0 0 6px; }
  p  { color: #9aa7bd; margin: 0 0 20px; }
  code#code {
    display: block; word-break: break-all; user-select: all;
    background: #0b0e14; border: 1px solid #2d3a57;
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 14px; color: #4de1c1;
  }
  button {
    background: #4de1c1; color: #08111a; border: 0; border-radius: 9px;
    padding: 11px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .error { color: #ff8a8a; }
  .nota { font-size: 13.5px; color: #7c8aa3; margin: 18px 0 0; }
</style>
</head>
<body>
  <div class="caja">
    <h1 id="titulo">Autorización completada</h1>
    <p id="sub">Copia este código y pégalo en el script <code>obtener_token_tiktok.py</code>.</p>
    <code id="code">…</code>
    <button id="btn" type="button">Copiar código</button>
    <p class="nota">El código sirve una sola vez y caduca en pocos minutos.
      Si falla, vuelve a ejecutar el script para generar un enlace nuevo.</p>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const error = params.get("error");
  const elCode = document.getElementById("code");
  const btn = document.getElementById("btn");

  if (code) {
    elCode.textContent = decodeURIComponent(code);
  } else if (error) {
    document.getElementById("titulo").textContent = "La autorización falló";
    document.getElementById("titulo").className = "error";
    document.getElementById("sub").textContent =
      params.get("error_description") || "TikTok devolvió un error.";
    elCode.textContent = error;
    btn.style.display = "none";
  } else {
    document.getElementById("titulo").textContent = "Página de retorno de TikTok";
    document.getElementById("sub").textContent =
      "Esta página recibe el código de autorización. Llega aquí desde el enlace que genera el script.";
    elCode.style.display = "none";
    btn.style.display = "none";
  }

  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(elCode.textContent);
      btn.textContent = "Copiado";
      setTimeout(() => (btn.textContent = "Copiar código"), 1800);
    } catch {
      btn.textContent = "Selecciónalo y copia a mano";
    }
  });
</script>
</body>
</html>
